apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-java-app1
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: my-java-app1
      sourceRef:
        kind: HelmRepository
        name: my-java-app1
        namespace: default
      interval: 10m
  values:
    imagePullSecrets:
      - name: ghcr-auth
    image:
      repository: ghcr.io/bazoocaze/my-java-app1
      tag: 1.0.0 # {"$imagepolicy": "default:my-java-app1:tag"}
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      hosts:
        - host: localhost
          paths:
            - path: /my-java-app1(/|$)(.*)
              pathType: ImplementationSpecific
