apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-java-app
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: my-java-app
      sourceRef:
        kind: HelmRepository
        name: my-java-app
        namespace: default
      interval: 10m
  values:
    imagePullSecrets:
      - name: ghcr-auth
    image:
      repository: ghcr.io/bazoocaze/my-java-app
      tag: 1.0.18 # {"$imagepolicy": "default:my-java-app:tag"}
    ingress:
      enabled: true
